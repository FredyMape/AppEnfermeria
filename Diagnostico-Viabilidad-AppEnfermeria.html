<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de viabilidad · AppEnfermería</title>
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--surface2:#eeede9;--text:#1a1d21;--muted:#565f6b;--border:#d5d9de;--accent:#1f5fae;
  --red:#a8241c;--red-bg:#fdecea;--amber:#7a4b00;--amber-bg:#fff2d2;--green:#17603a;--green-bg:#e1f3e8;--gray:#4d5560;--gray-bg:#eceef1;
  --c-critica:#a8241c;--c-alta:#b23a08;--c-media:#7a5d00;--c-baja:#365a86;
  --heat0:#e6f2e9;--heat1:#fff2d2;--heat2:#ffdcb8;--heat3:#f9b8b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217;--surface:#171b22;--surface2:#212733;--text:#e9ecf0;--muted:#a6afbb;--border:#303844;--accent:#7ab0ff;
    --red:#ff9a91;--red-bg:#3b1b19;--amber:#f3bf55;--amber-bg:#372b0d;--green:#75d8a0;--green-bg:#13321f;--gray:#b7bfca;--gray-bg:#272d36;
    --c-critica:#ff9a91;--c-alta:#ffab73;--c-media:#f2d160;--c-baja:#93b8ea;
    --heat0:#173225;--heat1:#3a3011;--heat2:#4a2f18;--heat3:#5a2622;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217;--surface:#171b22;--surface2:#212733;--text:#e9ecf0;--muted:#a6afbb;--border:#303844;--accent:#7ab0ff;
  --red:#ff9a91;--red-bg:#3b1b19;--amber:#f3bf55;--amber-bg:#372b0d;--green:#75d8a0;--green-bg:#13321f;--gray:#b7bfca;--gray-bg:#272d36;
  --c-critica:#ff9a91;--c-alta:#ffab73;--c-media:#f2d160;--c-baja:#93b8ea;
  --heat0:#173225;--heat1:#3a3011;--heat2:#4a2f18;--heat3:#5a2622;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.35rem;margin-bottom:.25rem}
h3{font-size:1.02rem}
p{margin:.35rem 0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;align-self:start;height:100vh;padding:18px 12px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{padding:4px 8px 12px}
.brand b{display:block;font-size:1rem}
.brand span{color:var(--muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav button:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav .n{opacity:.85;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:8px}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 11px}
.btn:hover{background:var(--surface2)}
main{padding:24px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
section[hidden]{display:none}
.lead{color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.verdict{border:2px solid;border-radius:14px;padding:18px}
.verdict.rojo{border-color:var(--red);background:var(--red-bg)}
.verdict.amarillo{border-color:var(--amber);background:var(--amber-bg)}
.verdict.verde{border-color:var(--green);background:var(--green-bg)}
.verdict.gris{border-color:var(--gray);background:var(--gray-bg)}
.sem{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.rojo .dot{background:var(--red)}.amarillo .dot{background:var(--amber)}.verde .dot{background:var(--green)}.gris .dot{background:var(--gray)}
.rojo .sem{color:var(--red)}.amarillo .sem{color:var(--amber)}.verde .sem{color:var(--green)}.gris .sem{color:var(--gray)}
.verdict h1{font-size:clamp(1.35rem,3.2vw,1.95rem);margin:.35rem 0 .5rem}
.verdict ul{margin:.5rem 0 0;padding-left:1.15rem}
.verdict li{margin:.3rem 0}
.meta-line{font-size:.85rem;color:var(--muted);margin-top:.6rem}
.stat{padding:12px 14px}
.stat .v{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat.sev{border-left:6px solid}
.k-critica{border-color:var(--c-critica)}.k-alta{border-color:var(--c-alta)}.k-media{border-color:var(--c-media)}.k-baja{border-color:var(--c-baja)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.tag.critica{color:var(--c-critica)}.tag.alta{color:var(--c-alta)}.tag.media{color:var(--c-media)}.tag.baja{color:var(--c-baja)}
.tag.verificada{color:var(--green)}.tag.supuesto{color:var(--amber)}.tag.sinsustento{color:var(--red)}.tag.inferencia{color:var(--accent)}.tag.ne{color:var(--gray)}
.acts{counter-reset:a;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.acts li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.acts li::before{content:counter(a);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:.75rem;cursor:pointer}
.chip.static{cursor:default}
details{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:10px 0}
details>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style-position:inside}
details>.body{padding:2px 16px 14px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--border)}
thead th{background:var(--surface2);position:sticky;top:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
th button{all:unset;cursor:pointer;font:inherit;text-transform:inherit}
th button:focus-visible{outline:3px solid var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
tr.dim-row{cursor:pointer}
tr.dim-row:hover{background:var(--surface2)}
tr.detail td{background:var(--surface2)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}
.controls label{display:grid;gap:3px;font-size:.78rem;color:var(--muted)}
.controls select,.controls input{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:150px}
.viz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
svg text{fill:var(--text);font-family:inherit}
svg .muted{fill:var(--muted)}
.cite{font-style:italic;color:var(--muted);font-size:.83rem}
.pm-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pm-list li{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.pm-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.warn{border:1px dashed var(--amber);background:var(--amber-bg);color:var(--text);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.progress{height:14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.progress>div{height:100%;background:var(--green);transition:width .2s}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.chk input{width:20px;height:20px;margin-top:2px}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.card-sup{display:grid;gap:6px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;margin-top:6px}
.small{font-size:.83rem;color:var(--muted)}
footer{margin-top:30px;color:var(--muted);font-size:.8rem}
main,.sidebar{min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{padding:16px}
  .sidebar{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .hero,.viz{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .mtoggle{display:inline-flex!important}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:2px solid var(--border);padding:8px 0}
  table.stack td{border:0;padding:4px 10px}
  table.stack td::before{content:attr(data-l);display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
}
.mtoggle{display:none}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr 1fr}}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .sidebar,.controls,.mtoggle{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  section[hidden]{display:block!important;break-before:page}
  section#s-resumen{break-before:auto}
  .card,details,.verdict,.acts li,.pm-list li{break-inside:avoid}
  details>.body{display:block}
  tr.detail[hidden]{display:table-row!important}
  .tbl-wrap{overflow:visible;border:0}
  thead th{position:static}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegación">
    <div class="brand"><b>Diagnóstico de viabilidad</b><span id="brandSub"></span></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot"><button class="btn" id="themeBtn" type="button" aria-label="Cambiar tema claro u oscuro">Tema: automático</button></div>
    <button class="btn mtoggle" id="themeBtn2" type="button" aria-label="Cambiar tema">Tema</button>
  </aside>
  <main id="main" tabindex="-1">
    <section id="s-resumen"></section>
    <section id="s-matriz" hidden></section>
    <section id="s-incong" hidden></section>
    <section id="s-premortem" hidden></section>
    <section id="s-supuestos" hidden></section>
    <section id="s-brechas" hidden></section>
    <section id="s-condiciones" hidden></section>
    <section id="s-auto" hidden></section>
    <footer id="foot"></footer>
  </main>
</div>

<script>
/* ============================================================
   ÚNICA FUENTE DE DATOS. Toda cifra, tabla y gráfica se deriva de aquí.
   Convención de comillas dentro de textos: « » (cita textual del corpus).
   ============================================================ */
const DIAGNOSTICO = {
  meta: {
    proyecto: "Plataforma de Servicios de Enfermería (AppEnfermeria)",
    fecha: "2026-09-29",
    corpus: [
      "Requirements-Context.md (normativo)",
      "HU-01, HU-02, HU-03, HU-04 (normativo, «Definida para MVP»)",
      "specs/context/vision.md (status: «borrador»)",
      "specs/context/domain-model.md, business-rules-index.md, glossary.md, personas.md (derivados)",
      "Auditoria-Especificacion.md (auditoría previa: tratada como fuente a verificar, no como verdad)"

  },

  dimensiones_def: [

    {id:"financiera", nombre:"Financiera", corto:"Financiera"},
    {id:"operativa", nombre:"Operativa", corto:"Operativa"},
    {id:"mercado", nombre:"Mercado / demanda", corto:"Mercado"},
    {id:"legal", nombre:"Legal / regulatoria", corto:"Legal"},
    {id:"cronograma", nombre:"Cronograma", corto:"Cronograma"},
    {id:"riesgos", nombre:"Riesgos externos", corto:"Riesgos ext."},
    {id:"sostenibilidad", nombre:"Sostenibilidad", corto:"Sostenib."}
  ],

  veredicto: {
    valor: "NO VIABLE EN SU ESTADO ACTUAL",
    confianza: "Media",
    confianza_detalle: "Alta en las incongruencias (cada una tiene cita textual verificable). Baja en la viabilidad económica y de mercado: {ne} de {totdim} dimensiones no son evaluables por falta de datos.",
    alcance_veredicto: "El veredicto califica el conjunto de especificaciones tal como está, no la idea de negocio. Con las {ne} dimensiones sin datos, el mejor resultado posible tras corregir la especificación sería «INSUFICIENTE INFORMACIÓN», no «VIABLE».",
    razones: [
      "Hay {crit} incongruencias críticas abiertas: el MVP está definido de dos maneras incompatibles (vision.md borrador vs. Requirements-Context y HU-01…04) en pagos, modelo de asignación, verificación de identidad y consentimiento.",
      "Solo {eval} de {totdim} dimensiones son evaluables y {reprob} de esas {eval} quedan por debajo de 3: la regla exige que ninguna evaluada sea menor a 3 para poder ser «VIABLE».",
      "No existe presupuesto, cronograma, equipo ni datos de mercado en ningún documento, y 13 historias (HU-05…HU-17) más 4 vacíos no planificados siguen sin escribirse."
    ]
  },

  reconstruccion: {
    objetivo: "Marketplace que conecta a personas que necesitan enfermería (para sí o para un tercero) con enfermeros registrados y aprobados manualmente por un superadministrador. Incluye aceptación atómica de servicios, inicio por PIN, extensión, calificación obligatoria y auditoría.",
    alcance: "Normativo (Requirements-Context + HU-01…04): registro de usuario y enfermero, verificación manual, catálogo de 4 tipos de servicio y reglas del ciclo de vida. Aspiracional (vision.md, borrador): además directorio de enfermeros, geolocalización real, precio híbrido con contraoferta, pasarela de pagos, verificación facial y ubicación en tiempo real con contacto de emergencia.",
    entregables: "Solo documentación: 4 HU definidas, 13 HU pendientes (HU-05…HU-17) y contexto derivado. Sin código, sin diseños, sin wireframes.",
    actores: "Usuario/Cliente, Enfermero, Superadministrador (roles fijos, uno por persona).",
    plazos: "No definidos en ningún documento.",
    presupuesto: "No definido. Única mención: «No hay presupuesto asignado todavía» para verificación biométrica (vision §7).",
    recursos: "No definidos (equipo de desarrollo, revisores de perfiles, soporte).",
    supuestos_declarados: [
      "La plataforma es intermediario tecnológico y no prestador de salud (vision §5; declarado «por validar»).",
      "Los canales informales actuales tienen los problemas descritos (vision §1; declarado como hipótesis sin datos).",
      "Modelo de precio híbrido: tarifa sugerida + oferta del usuario + contraoferta del enfermero (CN-06, decisión del developer).",
      "Un solo rol por persona en el MVP (CN-07, decisión del developer).",
      "Internet obligatorio durante el servicio, sin modo offline (vision §7: «restricción de negocio aceptada»)."
    ],
    ambiguedades: [
      "¿Qué documento manda cuando vision.md y Requirements-Context/HU se contradicen? No hay regla de precedencia.",
      "¿Quién cobra, cuánto y cuándo? No hay modelo de ingresos ni de liquidación, pero el MVP incluye pasarela.",
      "¿Quién es el «paciente» que valida el PIN cuando el servicio es para un tercero?",
      "¿Cuántos revisores hay y qué más hace el superadministrador?",
      "¿Qué significa «servicio programado» frente a uno inmediato? (§9 solo menciona «Si el servicio es programado».)",
      "¿Cuántas personas, con qué perfiles y en qué plazo construirán y operarán esto?"
    ]
  },

  dimensiones: [
    {id:"tecnica", puntaje:3, confianza:"Media",
     evidencia:[
       {t:"VERIFICADA", x:"Los principios declarados son correctos: asignación única y atómica (Req §10.2, CTX-RN-01/02), validación en backend (§21), PIN con hash (CTX-RN-18) y contraseña de 12 a 64 caracteres (HU01-RN-06)."},
       {t:"VERIFICADA", x:"Faltan decisiones sin las cuales no se puede implementar ni probar: idempotencia solo enunciada (§10.3, sin clave ni retención), TTL/intentos del código de correo pendientes (HU-01), y 0 coincidencias de zona horaria, MFA, latencia o volumetría en los documentos normativos."},
       {t:"SUPUESTO", x:"Que el alcance de vision.md (pagos, biometría, geolocalización, tiempo real, negociación) sea construible: no hay arquitectura, proveedores ni requisitos no funcionales."},
       {t:"VERIFICADA", x:"No existe código en el repositorio; no se evaluó implementación."}
     ],
     riesgo:"Alcance técnico ampliado en vision.md sin arquitectura, proveedores ni requisitos no funcionales que lo respalden."},
    {id:"financiera", puntaje:null, confianza:"—",
     evidencia:[{t:"VERIFICADA", x:"0 menciones de presupuesto total, costos, precios reales o ingresos. Única cifra económica: la ausencia de presupuesto para biometría (vision §7). La comisión figura como «A definir»."}],
     riesgo:"No evaluable: no se puede saber si el proyecto es financiable ni rentable.",

       {t:"VERIFICADA", x:"No existe proceso de soporte: el desbloqueo tras 5 intentos de PIN está «pendiente de definición» (Req §15) y sin HU; la recaptura periódica de foto «debe diseñarse» (vision §7)."},
       {t:"SUPUESTO", x:"Que 24–36 h sea alcanzable: la propia visión reconoce que el SLA «se degrada rápidamente» (vision §8) y no define revisores ni reloj."},
       {t:"VERIFICADA", x:"0 menciones al tamaño del equipo: la confianza de esta calificación es baja."}
     ],
     riesgo:"Cuello de botella humano en el camino crítico de la oferta y ausencia de soporte para incidentes en tiempo real."},
    {id:"mercado", puntaje:null, confianza:"—",
     evidencia:[{t:"VERIFICADA", x:"vision §1 admite: «no se dispone de datos de mercado verificados»; §8 marca la baja liquidez como «No cubierto en esta fase». Todos los objetivos de métricas están en «A definir»."}],
     riesgo:"No evaluable: la demanda y la disposición a pagar no están demostradas.",
     por_que_null:"Sin datos de demanda, oferta de enfermeros, tamaño de mercado ni disposición a pagar."},
    {id:"legal", puntaje:2, confianza:"Media",
     evidencia:[
       {t:"VERIFICADA", x:"La clasificación intermediario vs. prestador de salud está declarada «restricción activa, no resuelta» (vision §7) y diseño actual «tiene rasgos de prestador»."},
       {t:"VERIFICADA", x:"Los flujos normativos recogen datos de salud (HU-01) sin autorización, aviso ni finalidad, aunque la visión exige «base legal, consentimiento y aviso de privacidad antes de recolectar» (vision §7). Sin consentimiento biométrico ni del tercero titular en ninguna HU."},
       {t:"SUPUESTO", x:"Marco citado por la auditoría previa (Ley 1581/2012 art. 23, Res. 3100/2019, Ley 1164/2007): coincide con mi conocimiento general, pero no fue re-verificado contra fuente primaria en esta sesión. Requiere concepto jurídico."},
       {t:"INFERENCIA", x:"Se califica 2 y no 1 porque la visión ya reconoce los riesgos y propone mitigaciones; el problema es que no llegaron a las HU."}
     ],
     riesgo:"Tratamiento de datos de salud, biométricos y de ubicación sin base legal implementada, sobre una clasificación regulatoria sin resolver."},
    {id:"cronograma", puntaje:null, confianza:"—",
     evidencia:[{t:"VERIFICADA", x:"0 menciones de cronograma, hitos, fechas objetivo ni capacidad del equipo en todo el corpus."}],
     riesgo:"No evaluable.",
     por_que_null:"Sin fechas, hitos, equipo ni estimaciones."},
    {id:"riesgos", puntaje:2, confianza:"Media",
     evidencia:[
       {t:"VERIFICADA", x:"Dependencias externas críticas sin proveedor ni costo: pasarela de pagos, verificación facial (vision §7 y preguntas abiertas), correo/SMS y geolocalización. 0 menciones de proveedor en los documentos normativos."},
       {t:"VERIFICADA", x:"Conectividad obligatoria sin modo offline y sin tolerancia definida a cortes durante un servicio (vision §7, pregunta abierta 10)."},

  incongruencias: [
    {id:"INC-01", sev:"Crítica", tipo:"Consistencia documental", nat:"Hecho",
     ubic:"vision.md (front-matter y §5) vs. HU-01…HU-04 y Requirements-Context.md",
     cita:"vision.md: status: «borrador» y «Pasarela de pagos integrada en el MVP». HU-01…04: «Estado: Definida para MVP».",
     expl:"Hay dos definiciones de MVP. El documento en borrador amplía el alcance (pagos, biometría, geolocalización, directorio, negociación, tiempo real) y declara que «reabre y reemplaza» una restricción de HU-02, pero las HU «definidas» y Requirements-Context no se actualizaron y no hay regla de precedencia. Cada equipo construiría un producto distinto según el documento que lea.",
     corr:"Declarar un documento normativo único: aprobar o descartar cada ampliación de vision.md, propagar lo aprobado a Requirements-Context y a las HU, y marcar el estado real de cada documento."},
    {id:"INC-02", sev:"Crítica", tipo:"Objetivos vs. alcance", nat:"Hecho",
     ubic:"Requirements-Context §9 y §17.1; HU-01/03/04 «Fuera de alcance»; vision.md §5; Req §29",
     cita:"§9: «Precio ofrecido.» · §17.1: «El sistema calcula el valor adicional correspondiente.» · HU-04: «Definición de tarifas.» fuera de alcance · vision §5: «Pasarela de pagos integrada en el MVP (no se pospone a una fase posterior)».",
     expl:"El sistema muestra y recalcula precios y la visión exige cobrar en el MVP, pero ninguna HU definida ni pendiente (HU-05…HU-17) cubre tarifa, negociación, pago, comisión ni liquidación. CN-06 confirmó el modelo híbrido pero admite que «no crea todavía el mecanismo concreto».",
     corr:"Escribir las historias de precio/negociación y de pagos (proveedor, custodia, comisión, reembolso) antes de HU-05 y añadirlas a la lista de §29."},
    {id:"INC-03", sev:"Crítica", tipo:"Metas incompatibles", nat:"Hecho",
     ubic:"Requirements-Context §8.2 y §10.2; vision.md §5",
     cita:"§10.2: «El primer enfermero cuya confirmación sea procesada correctamente obtendrá la asignación.» · vision §5: «el enfermero puede contraofertar… Requiere una historia de negociación de precio antes de la asignación» y «dirigir/invitar la solicitud a uno específico».",
     expl:"La asignación atómica por orden de llegada es incompatible con contraoferta previa y con invitación dirigida. Ambas exigen estados y reglas (ofertada, invitada, contraofertada) que la máquina de estados (Publicado → Asignado) no tiene, y cambian qué significa «atómico» y quién gana.",
     corr:"Decidir el modelo de asignación del MVP (feed atómico, negociación o directorio) y rediseñar la tabla de transiciones con estados y guardas."},
    {id:"INC-04", sev:"Crítica", tipo:"Objetivos vs. alcance", nat:"Hecho",
     ubic:"HU-02 RN-02 y RN-04; HU-03; Req §14; vision.md §5 y §8",
     cita:"HU-02 RN-02: cuatro documentos obligatorios (identidad, foto, título, tarjeta) y RN-04 «La aprobación… debe realizarse manualmente». vision §5: «una foto en vivo se contrasta contra el documento de identidad» (máx. 2 intentos). vision §8: mitigación «biometría/prueba de vida y contraste… contra el ReTHUS antes de aprobar».",
     expl:"La visión identifica como riesgo la suplantación de un enfermero en el domicilio y fija su mitigación, pero HU-02/03 verifican solo imágenes autoportadas y Req §14 solo prevé el PIN. Los antecedentes disciplinarios siguen como documento opcional (HU-02). La auditoría previa propone 3 intentos biométricos (CA-E-06) frente a los 2 de la visión.",
     corr:"Incorporar a HU-02/03 el contraste con ReTHUS y la verificación facial (intentos, fallback, proveedor), hacer obligatorios los antecedentes y unificar el número de intentos."},
    {id:"INC-05", sev:"Crítica", tipo:"Supuestos contradictorios", nat:"Hecho",
     ubic:"HU-01 (criterios y flujo); Req §4.2 y §21; vision.md §5 y §7",
     cita:"HU-01: «Los datos médicos propios pueden almacenarse durante el registro.» (ningún paso de autorización) · vision §7: el tratamiento de salud «requiere base legal, consentimiento y aviso de privacidad antes de recolectar datos médicos»; biometría con «consentimiento explícito y separado».",
     expl:"El flujo normativo recoge datos de salud (y, según la visión, biométricos y de ubicación) sin autorización, aviso ni finalidad, y sin contemplar al tercero titular (HU01-RN-05). Req §21 se titula «Privacidad» pero solo trata control de acceso. La visión declara la obligación y las HU la ignoran.",
     corr:"Añadir a HU-01/HU-02 pasos y criterios de autorización expresa (versión del aviso, fecha, canal), consentimiento separado para biometría y ubicación, y un mecanismo para el tercero titular; reescribir §21 como capítulo de cumplimiento."},
    {id:"INC-06", sev:"Alta", tipo:"Dependencias sin precedente", nat:"Hecho",
     ubic:"HU-02 (flujo, pasos 1–14); HU-01 «Fuera de alcance»; Req §4.3–4.4 y §22",
     cita:"HU-02 no contiene contraseña ni verificación de correo. HU-01 excluye «Registro y aprobación profesional de enfermeros.» Req §4.3 y §4.4 están bajo «4. Usuario / Cliente».",
     expl:"Ninguna historia define cómo el enfermero crea credenciales, verifica su correo o inicia sesión, ni cómo se crea y protege (MFA: 0 menciones) la cuenta del superadministrador que aprueba perfiles con datos sensibles. HU-03 depende de ambas.",
     corr:"Extender política de credenciales y verificación de correo a todos los roles y añadir una HU de alta y protección de cuentas administrativas."},
    {id:"INC-07", sev:"Alta", tipo:"Objetivos vs. alcance", nat:"Hecho",
     ubic:"Requirements-Context §7; HU-04 RN-01 y criterios; vision.md §5",
     cita:"Req §7: «Para el MVP se definirán… 4. Atención hospitalaria.» · vision §5 «Explícitamente fuera del MVP»: «Atención hospitalaria dentro de una IPS mediante convenio formal».",
     expl:"El catálogo sembrado del MVP incluye un tipo que la visión excluye del MVP. HU-04 exige que el sistema «cuenta con los cuatro tipos», así que se ofrecería a los usuarios algo que el negocio dice que no presta.",
     corr:"Decidir si el tipo entra o no; si no, sembrarlo inactivo y ajustar RN-01 y los criterios de HU-04."},
    {id:"INC-08", sev:"Alta", tipo:"Supuestos contradictorios", nat:"Hecho",
     ubic:"Req §5.1 y §9; HU-02 RN-05; glossary.md; vision.md §5",
     cita:"Req §5.1: «No se almacenará ni solicitará un radio de servicio. Solamente se almacenará la zona de residencia.» · Req §9: «Distancia aproximada.» · vision §5: «Geolocalización real del enfermero (no solo zona de residencia como texto libre)».",
     expl:"Para mostrar distancia hace falta una referencia geográfica del enfermero; la restricción vigente lo impide y la visión la deroga sin actualizar Req, HU-02 ni el glosario. Además la zona no tiene tipo de dato (texto libre, código DANE o coordenadas).",
     corr:"Reemplazar formalmente la restricción, definir el tipo de dato y la precisión, y actualizar Req §5.1, HU-02 y glosario."},
    {id:"INC-09", sev:"Alta", tipo:"Metas incompatibles", nat:"Hecho + inferencia",
     ubic:"Requirements-Context §9 y §12.1; vision.md (pregunta abierta 5)",
     cita:"§9: «Punto de origen.», «Descripción general del servicio.» y «Los datos personales adicionales y los datos médicos sensibles del paciente no estarán disponibles en esta etapa.» · vision: «¿Qué nivel de precisión de geolocalización se requiere (ciudad/barrio vs. coordenadas exactas)…?»",
     expl:"La lista previa a la aceptación muestra el origen (el domicilio de una persona vulnerable) y un texto libre a todos los enfermeros aprobados, sin precisión definida ni filtro. Una dirección exacta o una descripción como «paciente con demencia» filtra identidad o salud antes de la asignación, contradiciendo la regla que la misma sección enuncia.",
     corr:"Fijar la precisión máxima del origen hasta la asignación y estructurar o filtrar el texto libre para impedir datos de salud."},
    {id:"INC-10", sev:"Alta", tipo:"Metas incompatibles", nat:"Hecho + inferencia",
     ubic:"Requirements-Context §19.1, RN-17 (§27.1), §14.2 y §17; vision.md §3",
     cita:"§19.1: «No podrá realizar otras acciones dentro de la aplicación.» · vision §3: «ambos lados del marketplace deben tener fricción mínima para lograr liquidez».",
     expl:"El bloqueo total por calificación pendiente impediría consultar el PIN, aprobar una extensión de un servicio en curso, cancelar o pedir ayuda mientras el usuario debe calificar otro servicio. Contradice el objetivo de fricción mínima y las reglas de PIN y extensión.",
     corr:"Convertir el bloqueo en restricción específica (p. ej. no crear ni aceptar servicios nuevos) y excluir PIN, extensiones, cancelación y soporte."},
    {id:"INC-11", sev:"Alta", tipo:"Dependencias sin precedente", nat:"Hecho",
     ubic:"Requirements-Context §15 y §29; business-rules-index.md (Vacíos)",
     cita:"§15: «El mecanismo exacto para desbloquear el servicio después de alcanzar el límite de intentos queda pendiente de definición.»",
     expl:"Tras 5 intentos fallidos el servicio queda bloqueado sin salida, con el paciente esperando, y ninguna HU (ni de la lista de §29) lo asume. La visión sí define un fallback para la verificación facial pero no para el PIN.",
     corr:"Escribir la HU de desbloqueo (soporte con doble autorización o regeneración de PIN notificada a ambas partes)."},
    {id:"INC-12", sev:"Alta", tipo:"Dependencias sin precedente", nat:"Hecho",
     ubic:"Requirements-Context §8.2, §16, §26.1 y §29",
     cita:"§26.1: «Publicado / Asignado / En curso → Cancelación válida → Cancelado… Las condiciones específicas de cancelación deberán definirse en la historia de usuario correspondiente.» · §16: «solamente podrá ser finalizado cuando se haya cumplido como mínimo la duración contratada.»",
     expl:"La historia de cancelación no existe ni está en la lista de pendientes. Se permite pasar de «En curso» a «Cancelado» sin reglas, mientras §16 solo prevé finalizar tras la duración contratada: no hay terminación anticipada, no-show ni expiración de solicitudes sin aceptar.",
     corr:"Escribir HU de cancelación, no-show y expiración, con tabla explícita de transiciones y guardas."},
    {id:"INC-13", sev:"Alta", tipo:"Alcance vs. recursos", nat:"Hecho + inferencia",
     ubic:"HU-03 RN-09; Req §22; vision.md §8",
     cita:"HU-03 RN-09: «El objetivo de revisión… será de 24 a 36 horas.» · vision §8: «El SLA de revisión se degrada rápidamente al crecer el volumen», mitigación «más de un revisor + métricas de cola desde el diseño».",
     expl:"La visión reconoce el cuello de botella y su mitigación, pero HU-03 mantiene un SLA sin revisores, sin reloj (¿se reinicia al corregir?) y sin métricas. Con las premisas de la auditoría previa (no medidas) el SLA se rompe con pocas decenas de registros al día; ver cálculo en Autoverificación.",
     corr:"Definir revisores, reloj y métricas del SLA; incorporar verificación asistida para que el humano revise solo excepciones."},
    {id:"INC-14", sev:"Alta", tipo:"Modelo de datos", nat:"Hecho",
     ubic:"vision.md §5 y preguntas abiertas 8–10; domain-model.md §1; HU-01",
     cita:"vision §5: «el usuario/paciente debe tener su ubicación activa y compartida en tiempo real con un contacto de emergencia designado».",
     expl:"Ubicación en tiempo real y contacto de emergencia están en el MVP, pero el modelo de dominio no tiene entidades para ellos, HU-01 no captura contacto de emergencia y las preguntas de la visión (obligatoriedad, paciente sin GPS, cortes de conexión) siguen abiertas. Es dato sensible continuo de una persona vulnerable.",
     corr:"Modelar las entidades, definir obligatoriedad y excepciones, y escribir la HU correspondiente con su consentimiento."},
    {id:"INC-15", sev:"Media", tipo:"Dependencias sin precedente", nat:"Hecho + inferencia",
     ubic:"Requirements-Context §11, §12.2 y §29 (HU-17); vision.md §5",
     cita:"§11: «Se habilitará la información necesaria para coordinar el servicio.» · §12.2: «Los datos de contacto se habilitarán de acuerdo con las mismas reglas de tiempo» · vision: chat fuera del MVP «más allá de lo estrictamente necesario para coordinar».",
     expl:"Con la ventana por defecto de 180 min, un servicio aceptado con días de antelación no permite contactar al paciente hasta 3 h antes, y no está definido qué canal cubre «lo estrictamente necesario». Tampoco se define el caso de un servicio que se acepta con menos de 180 min de margen ni el «servicio no programado».",
     corr:"Definir el canal mínimo de coordinación y el comportamiento para servicios con menos margen que la ventana."},
    {id:"INC-16", sev:"Media", tipo:"Terminología y definiciones", nat:"Hecho",
     ubic:"Requirements-Context §5.2 y §6.1; HU-03 (flujos de rechazo y corrección, RN-05)",
     cita:"§5.2: «Rechazado y Corrección solicitada son estados independientes: el primero indica que la información no fue aprobada… el segundo que se requieren ajustes puntuales». HU-03: ambos flujos terminan igual (corrige, solicita nueva revisión, vuelve a «Pendiente de revisión»). §6.1: «Rechazar / solicitar corrección» como una sola acción.",
     expl:"Dos estados con significados distintos y comportamiento idéntico: la distinción no tiene efecto. No hay estado terminal de rechazo ni apelación, y solo el rechazo exige comentario por regla (RN-05).",
     corr:"Definir qué diferencia el rechazo (p. ej. terminal o con límite de ciclos) de la corrección, o fusionar los estados."},
    {id:"INC-17", sev:"Media", tipo:"Métricas de éxito", nat:"Hecho",
     ubic:"vision.md §2 y §6; Req §8.1 y §26",
     cita:"vision §6: «% de solicitudes PUBLICADO que llegan a ASIGNADO antes de expirar» · todos los objetivos: «A definir». vision §2: conecta «de forma confiable».",
     expl:"Una métrica depende del estado «expirar», que no existe en los cinco estados del servicio. Además ninguna de las cinco métricas mide la promesa central (confianza y seguridad: incidentes, suplantaciones detectadas, cancelaciones) y ninguna tiene umbral.",
     corr:"Añadir el estado de expiración o redefinir la métrica; incluir al menos una métrica de seguridad/confianza y fijar umbrales."},
    {id:"INC-18", sev:"Media", tipo:"Terminología y definiciones", nat:"Hecho + inferencia",
     ubic:"Requirements-Context §14.3 y §4.2; vision.md §5; HU01-RN-05",
     cita:"§14.3: «El usuario consulta el PIN… El usuario proporciona el PIN al enfermero.» · vision §5: «el PIN sigue validando la presencia del paciente/usuario».",
     expl:"«Usuario» y «paciente» se usan como sinónimos, pero cuando el servicio es para un tercero son personas distintas: el PIN lo ve quien contrata, que puede estar ausente. Un PIN dictable por teléfono no prueba presencia, que es lo que la visión le atribuye.",

    {id:"INC-19", sev:"Media", tipo:"Modelo de datos", nat:"Hecho",
     ubic:"specs/context/domain-model.md §3 y §4",
     cita:"§4: «una misma Persona no puede registrarse bajo más de un Rol». Diagrama: «PERSONA ||--o{ ROL : asociado a (1:1, resuelto 2026-09-22)» y tres especializaciones opcionales «||--o|».",
     expl:"El diagrama expresa que una persona tiene cero o muchos roles y permite tener a la vez perfil de Usuario y de Enfermero, contra la decisión 1:1 (CN-07) que el propio texto cita.",
     corr:"Corregir el diagrama o añadir una restricción de exclusividad entre los perfiles."},
    {id:"INC-20", sev:"Media", tipo:"Modelo de datos", nat:"Hecho",
     ubic:"specs/context/domain-model.md §2 (Enfermero → Servicio)",
     cita:"«…un enfermero puede aceptar múltiples servicios… pero solo uno activo a la vez por regla de asignación única.»",
     expl:"CTX-RN-01 dice que un servicio tiene un solo enfermero, no que un enfermero tenga un solo servicio activo. La regla atribuida no existe y, al mismo tiempo, nada regula que un enfermero acepte servicios con horarios solapados.",
     corr:"Retirar la afirmación o convertirla en regla explícita, y definir el tratamiento de solapamientos."},
    {id:"INC-21", sev:"Media", tipo:"Consistencia documental", nat:"Hecho",
     ubic:"Requirements-Context §5.1 vs. HU-02 («Experiencia profesional», criterios de aceptación)",
     cita:"Req §5.1: «El registro deberá incluir información personal y profesional» (años, experiencia, lugares…). HU-02: «El enfermero podrá registrar: Años de experiencia. Experiencia profesional…»; ningún criterio de aceptación la exige.",
     expl:"El requisito dice «deberá incluir» y la historia lo hace opcional. Lo que el revisor debe poder evaluar no está definido.",
     corr:"Indicar qué campos de experiencia son obligatorios y añadir criterios de aceptación."},
    {id:"INC-22", sev:"Media", tipo:"Cifras", nat:"Hecho",
     ubic:"Auditoria-Especificacion.md §1.2, §3.4.5, §4.4.1, §6.2.1, Anexo A.2",
     cita:"«La cadena a1!… cumple los tres requisitos literales y el backend la aceptaría.» · tabla M/M/1: «15 | 0,50 | 1,9 h».",
     expl:"La auditoría previa (22-sep) describe como abiertos defectos ya corregidos (contraseña sin longitud: HU01-RN-06 exige 12–64; PIN en claro: CTX-RN-18; §9/§12.1 y numeración duplicada; lista de datos sensibles vacía). Contiene errores de cálculo: con μ=30/día y λ=15, W=24/(30−15)=1,6 h, no 1,9 h; y «≈7/día» mezcla multitarea con reprocesos (sin ellos son 9/día). La cifra «14 veces pendiente de definición» no se reproduce: hay 3 coincidencias exactas en Requirements+HU. Sus recomendaciones N:M y «probablemente no CRUD» fueron decididas al revés (CN-07, CN-05) sin dejar razón registrada.",
     corr:"Marcar la auditoría como histórica, corregir sus cifras y registrar por qué se descartaron recomendaciones que se rechazaron."},
    {id:"INC-23", sev:"Media", tipo:"Dependencias sin precedente", nat:"Hecho",
     ubic:"HU-01 (Flujos alternativos: código incorrecto y código expirado)",
     cita:"«Las reglas de expiración y cantidad máxima de intentos quedan pendientes de definición.» y, a continuación, «Si el código ha expirado: El sistema deberá informar al usuario.»",
     expl:"El flujo de código expirado presupone un tiempo de vida que la misma historia declara no definido. Sin TTL ni límite de intentos no se puede escribir el criterio de aceptación ni la prueba de seguridad.",
     corr:"Fijar TTL, intentos máximos, uso único y límite de reenvíos."},
    {id:"INC-24", sev:"Baja", tipo:"Modelo de datos", nat:"Hecho",
     ubic:"HU-02 «Información base de Persona» vs. Req §3.1 y domain-model.md §1",
     cita:"HU-02 ubica «Foto» y «Zona de residencia» en Persona; Req §3.1 y domain-model las ubican en Enfermero.",
     expl:"Dónde vive cada dato cambia el modelo de datos: Persona se comparte entre roles y el dato es solo del enfermero.",
     corr:"Unificar la ubicación de ambos campos."},
    {id:"INC-25", sev:"Baja", tipo:"Consistencia documental", nat:"Hecho",
     ubic:"Requirements-Context §12 y §14.2; domain-model.md (Configuracion)",
     cita:"§12: «El valor por defecto es de 180 minutos» (datos sensibles) · §14.2: «Configuración: 5 minutos antes» (solo ejemplo).",
     expl:"La ventana de datos sensibles tiene valor por defecto y la del PIN no. Si nadie la configura, el comportamiento es indefinido.",
     corr:"Fijar un valor por defecto para la ventana del PIN."},
    {id:"INC-26", sev:"Baja", tipo:"Consistencia documental", nat:"Hecho",
     ubic:"business-rules-index.md (CN-01) vs. Requirements-Context §12.1",

  supuestos: [
    {id:"SUP-01", enunciado:"La plataforma es un intermediario tecnológico y no un prestador de servicios de salud.", fuente:"vision.md §5 y §7", estado:"SUPUESTO", dim:"legal",

/* ============================================================
   DERIVACIÓN: todo lo que se muestra se calcula desde DIAGNOSTICO
   ============================================================ */
const D = DIAGNOSTICO;
const SEV = ["Crítica","Alta","Media","Baja"];
const SEVKEY = {"Crítica":"critica","Alta":"alta","Media":"media","Baja":"baja"};
const SEVICON = {"Crítica":"✖","Alta":"▲","Media":"◆","Baja":"●"};
const SEVRANK = {"Crítica":0,"Alta":1,"Media":2,"Baja":3};
const ESTADOS = ["VERIFICADA","SUPUESTO","SIN SUSTENTO"];
const ESTKEY = {"VERIFICADA":"verificada","SUPUESTO":"supuesto","SIN SUSTENTO":"sinsustento","INFERENCIA":"inferencia"};
const ESTICON = {"VERIFICADA":"✔","SUPUESTO":"?","SIN SUSTENTO":"✖","INFERENCIA":"≈"};
const SEMAFORO = {
  "VIABLE":{cls:"verde",txt:"Verde"},
  "VIABLE CON CONDICIONES":{cls:"amarillo",txt:"Amarillo"},
  "NO VIABLE EN SU ESTADO ACTUAL":{cls:"rojo",txt:"Rojo"},
  "INSUFICIENTE INFORMACIÓN":{cls:"gris",txt:"Gris"}
};
const dimDef = Object.fromEntries(D.dimensiones_def.map(d=>[d.id,d]));
const DIM = D.dimensiones.map(d=>({...dimDef[d.id],...d}));
const EVAL = DIM.filter(d=>d.puntaje!==null);
const S = {
  sev: Object.fromEntries(SEV.map(s=>[s,D.incongruencias.filter(i=>i.sev===s).length])),
  total: D.incongruencias.length,
  totdim: DIM.length,
  eval: EVAL.length,
  ne: DIM.length-EVAL.length,
  aprob: EVAL.filter(d=>d.puntaje>=3).length,
  reprob: EVAL.filter(d=>d.puntaje<3).length,
  avg: EVAL.reduce((a,d)=>a+d.puntaje,0)/EVAL.length,
  brechas: D.brechas.length,
  brechasAltas: D.brechas.filter(b=>b.prioridad==="Alta").length,
  est: Object.fromEntries(ESTADOS.map(e=>[e,D.supuestos.filter(s=>s.estado===e).length]))
};
const fmt1 = n => n.toFixed(2).replace(".",",");
const sub = s => String(s)
  .replaceAll("{crit}",S.sev["Crítica"]).replaceAll("{alta}",S.sev["Alta"])
  .replaceAll("{eval}",S.eval).replaceAll("{totdim}",S.totdim)
  .replaceAll("{ne}",S.ne).replaceAll("{reprob}",S.reprob).replaceAll("{total}",S.total);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const sevTag = s => `<span class="tag ${SEVKEY[s]}"><span aria-hidden="true">${SEVICON[s]}</span>${esc(s)}</span>`;
const estTag = e => `<span class="tag ${ESTKEY[e]}"><span aria-hidden="true">${ESTICON[e]}</span>${esc(e)}</span>`;
const refChips = refs => `<div class="refs">${refs.map(r=>/^INC-/.test(r)?`<button class="chip" data-inc="${esc(r)}" type="button" title="Ver en Incongruencias">${esc(r)}</button>`:`<span class="chip static">${esc(r)}</span>`).join("")}</div>`;
const scoreColor = v => v<3 ? "var(--red)" : v<4 ? "var(--amber)" : "var(--green)";
const scoreWord = v => v===null ? "N/E" : v<3 ? "Reprobada" : "Aprobada";

/* ---------- Gráficas SVG propias ---------- */
function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arcPath(cx,cy,r,a0,a1){const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);const large=Math.abs(a1-a0)>180?1:0;return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}

function gaugeSVG(score,max){
  const frac = Math.max(0,Math.min(1,score/max));
  const a1 = 180+180*frac;
  return `<svg viewBox="0 0 300 175" role="img" aria-label="Puntaje global ${fmt1(score)} de ${max}" style="width:100%;max-width:340px">

function radarSVG(){
  const cx=210,cy=205,R=140,n=DIM.length;
  const ang = i => -90 + i*360/n;
  let g="";
  for(let lv=1;lv<=5;lv++){
    const pts = DIM.map((_,i)=>polar(cx,cy,R*lv/5,ang(i)).map(v=>v.toFixed(1)).join(",")).join(" ");
    g += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
    const [lx,ly]=polar(cx,cy,R*lv/5,-90);
    g += `<text x="${(lx+4).toFixed(1)}" y="${(ly-2).toFixed(1)}" font-size="10" class="muted">${lv}</text>`;
  }
  DIM.forEach((d,i)=>{
    const [x,y]=polar(cx,cy,R,ang(i));
    const isNE = d.puntaje===null;
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" ${isNE?'stroke-dasharray="4 4"':''}/>`;
    const [tx,ty]=polar(cx,cy,R+26,ang(i));
    const anchor = Math.abs(tx-cx)<8?"middle":(tx>cx?"start":"end");
    g += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="600">${esc(d.corto)}</text>`;
    g += `<text x="${tx.toFixed(1)}" y="${(ty+14).toFixed(1)}" text-anchor="${anchor}" font-size="12" class="muted">${isNE?"N/E":d.puntaje+" / 5"}</text>`;
  });
  const ev = DIM.map((d,i)=>({d,i})).filter(o=>o.d.puntaje!==null);
  const pts = ev.map(o=>polar(cx,cy,R*o.d.puntaje/5,ang(o.i)).map(v=>v.toFixed(1)).join(",")).join(" ");
  g += `<polygon points="${pts}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2.5"/>`;
  ev.forEach(o=>{const [x,y]=polar(cx,cy,R*o.d.puntaje/5,ang(o.i));g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`});
  return `<svg viewBox="-50 0 520 420" role="img" aria-label="Radar de viabilidad por dimensión" style="width:100%;max-width:480px"><title>Radar de viabilidad; las dimensiones N/E no se dibujan como cero</title>${g}</svg>`;
}

function barsSVG(){
  const max = Math.max(...SEV.map(s=>S.sev[s]),1);
  const W=420,rowH=44,left=100;
  let g="";
  SEV.forEach((s,i)=>{
    const y=12+i*rowH, w=(W-left-50)*S.sev[s]/max;
    g += `<text x="0" y="${y+20}" font-size="13" font-weight="600">${SEVICON[s]} ${esc(s)}</text>`;
    g += `<rect x="${left}" y="${y}" width="${Math.max(w,2).toFixed(1)}" height="28" rx="5" fill="var(--c-${SEVKEY[s]})"/>`;
    g += `<text x="${(left+w+8).toFixed(1)}" y="${y+20}" font-size="14" font-weight="700">${S.sev[s]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${12+SEV.length*rowH}" role="img" aria-label="Incongruencias por severidad" style="width:100%;max-width:520px"><title>Conteo de incongruencias por severidad</title>${g}</svg>`;
}

function donutSVG(){
  const cx=100,cy=100,r=70,sw=30, total=D.supuestos.length;
  const col = {"VERIFICADA":"var(--green)","SUPUESTO":"var(--amber)","SIN SUSTENTO":"var(--red)"};
  let a=-90,g="";
  ESTADOS.forEach(e=>{
    const n=S.est[e]; if(!n) return;
    const sweep=360*n/total;
    if(n===total){g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col[e]}" stroke-width="${sw}"/>`}
    else g+=`<path d="${arcPath(cx,cy,r,a,a+sweep)}" fill="none" stroke="${col[e]}" stroke-width="${sw}"/>`;
    const [tx,ty]=polar(cx,cy,r,a+sweep/2);
    g+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width=".6" paint-order="stroke">${ESTICON[e]} ${n}</text>`;
    a+=sweep;
  });
  g+=`<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="26" font-weight="700">${total}</text><text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="11" class="muted">supuestos</text>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Proporción de supuestos por estado" style="width:100%;max-width:260px"><title>Proporción de supuestos por estado</title>${g}</svg>`;
}

function heatSVG(){
  const cw=96,ch=74,ox=64,oy=8;
  let g="";
  for(let imp=5;imp>=1;imp--){
    for(let p=1;p<=5;p++){
      const s=p*imp, band = s>=15?3:s>=10?2:s>=5?1:0;
      const x=ox+(p-1)*cw, y=oy+(5-imp)*ch;
      g+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="var(--heat${band})" stroke="var(--surface)" stroke-width="2"/>`;
      g+=`<text x="${x+cw-6}" y="${y+13}" text-anchor="end" font-size="10" class="muted">${s}</text>`;
      const here = D.premortem.filter(m=>m.p===p&&m.i===imp);
      here.forEach((m,k)=>{
        const col=k%2,row=Math.floor(k/2);
        const bx=x+5+col*44, by=y+20+row*22;
        g+=`<rect x="${bx}" y="${by}" width="42" height="19" rx="4" fill="var(--surface)" stroke="var(--text)" stroke-width="1.2"/><text x="${bx+21}" y="${by+13}" text-anchor="middle" font-size="11" font-weight="700">${esc(m.id)}</text>`;
      });
    }
    g+=`<text x="${ox-8}" y="${oy+(5-imp)*ch+ch/2+4}" text-anchor="end" font-size="12" font-weight="600">${imp}</text>`;
  }
  for(let p=1;p<=5;p++) g+=`<text x="${ox+(p-1)*cw+cw/2}" y="${oy+5*ch+18}" text-anchor="middle" font-size="12" font-weight="600">${p}</text>`;
  g+=`<text x="${ox+2.5*cw}" y="${oy+5*ch+38}" text-anchor="middle" font-size="12" class="muted">Probabilidad (1 muy baja – 5 muy alta)</text>`;
  g+=`<text transform="translate(14 ${oy+2.5*ch}) rotate(-90)" text-anchor="middle" font-size="12" class="muted">Impacto (1 – 5)</text>`;
  return `<svg viewBox="0 0 ${ox+5*cw+8} ${oy+5*ch+48}" role="img" aria-label="Mapa de calor de probabilidad por impacto" style="width:100%;max-width:640px"><title>Mapa de calor probabilidad × impacto; el número pequeño de cada celda es probabilidad por impacto</title>${g}</svg>`;
}

        <span class="small" style="display:block">Impacto: ${esc(b.impacto)}</span>
        <span class="small" style="display:block">Bloquea: ${b.bloquea.map(x=>esc(dimDef[x].nombre)).join(" · ")} · Prioridad: <span class="tag ${b.prioridad==='Alta'?'critica':'media'}">${b.prioridad==='Alta'?'▲':'◆'} ${b.prioridad}</span></span></span>
    </label>`).join("")}</div>
  <h3 style="margin-top:16px">Dimensiones no evaluables y qué las bloquea</h3>
  <table><thead><tr><th>Dimensión</th><th>Brechas que la bloquean</th></tr></thead><tbody>
  ${DIM.filter(d=>d.puntaje===null).map(d=>`<tr><td>${esc(d.nombre)}</td><td>${D.brechas.filter(b=>b.bloquea.includes(d.id)).map(b=>b.id).join(", ")}</td></tr>`).join("")}</tbody></table>`;
  const upd=()=>{$("#gapCount").textContent=`${gapChecked.size} de ${S.brechas} marcadas en pantalla (${altas.length} son de prioridad alta).`};
  $$("#s-brechas input[data-gap]").forEach(c=>c.addEventListener("change",()=>{
    c.checked?gapChecked.add(c.dataset.gap):gapChecked.delete(c.dataset.gap);
    c.closest(".chk").classList.toggle("done",c.checked);upd()}));
  upd();
}

const condChecked = new Set();
function renderCondiciones(){
  $("#s-condiciones").innerHTML = `
  <h2>Condiciones mínimas para aprobar</h2>
  <p class="lead">Lista concreta y medible. Marca las que se cumplan; el progreso se guarda solo en memoria mientras la página esté abierta.</p>
  <div class="card">
    <div class="pm-head"><b id="condTxt"></b><span class="small">Objetivo: ${D.condiciones.length} de ${D.condiciones.length}</span></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${D.condiciones.length}" id="condBar"><div id="condFill" style="width:0%"></div></div>
  </div>
  <div class="card" style="padding:0;margin-top:12px">${D.condiciones.map(c=>`
    <label class="chk" id="lab-${c.id}"><input type="checkbox" data-cond="${c.id}" aria-label="${c.id}">
      <span class="t"><b>${c.id}.</b> ${esc(c.texto)}${refChips(c.refs)}</span></label>`).join("")}</div>`;
  const upd=()=>{
    const n=condChecked.size,t=D.condiciones.length,pct=Math.round(100*n/t);
    $("#condFill").style.width=pct+"%";$("#condBar").setAttribute("aria-valuenow",n);
    $("#condTxt").textContent=`${n} de ${t} condiciones cumplidas (${pct} %)`;
  };
  $$("#s-condiciones input[data-cond]").forEach(c=>c.addEventListener("change",()=>{
    c.checked?condChecked.add(c.dataset.cond):condChecked.delete(c.dataset.cond);
    c.closest(".chk").classList.toggle("done",c.checked);upd()}));
  upd();
}

function coherencia(){
  const ids = new Set([...D.incongruencias.map(x=>x.id),...D.brechas.map(x=>x.id),...D.supuestos.map(x=>x.id),...D.premortem.map(x=>x.id),...D.condiciones.map(x=>x.id)]);
  const allRefs = [...D.condiciones,...D.premortem,...D.acciones].flatMap(x=>x.refs);
  const dimIds = new Set(DIM.map(d=>d.id));
  const rules = {
    "VIABLE": S.sev["Crítica"]===0 && EVAL.every(d=>d.puntaje>=3),
    "VIABLE CON CONDICIONES": S.sev["Crítica"]===0,
    "NO VIABLE EN SU ESTADO ACTUAL": true,
    "INSUFICIENTE INFORMACIÓN": true
  };
  const uniq = arr => new Set(arr).size===arr.length;
  return [
    ["Suma por severidad = total de incongruencias", SEV.reduce((a,s)=>a+S.sev[s],0)===S.total, `${SEV.map(s=>S.sev[s]).join(" + ")} = ${S.total}`],
    ["Suma de estados de supuestos = total de supuestos", ESTADOS.reduce((a,e)=>a+S.est[e],0)===D.supuestos.length, `${ESTADOS.map(e=>S.est[e]).join(" + ")} = ${D.supuestos.length}`],
    ["Aprobadas + reprobadas + N/E = total de dimensiones", S.aprob+S.reprob+S.ne===S.totdim, `${S.aprob} + ${S.reprob} + ${S.ne} = ${S.totdim}`],
    ["Causas del mapa de calor = causas del pre-mortem", D.premortem.every(m=>m.p>=1&&m.p<=5&&m.i>=1&&m.i<=5), `${D.premortem.length} causas dentro de la cuadrícula 5×5`],
    ["Identificadores únicos en todas las listas", uniq(D.incongruencias.map(x=>x.id))&&uniq(D.brechas.map(x=>x.id))&&uniq(D.supuestos.map(x=>x.id))&&uniq(D.premortem.map(x=>x.id))&&uniq(D.condiciones.map(x=>x.id)), `${ids.size} identificadores distintos`],
    ["Toda referencia cruzada apunta a un elemento existente", allRefs.every(r=>ids.has(r)), `${allRefs.length} referencias comprobadas`],
    ["Toda brecha bloquea dimensiones válidas", D.brechas.every(b=>b.bloquea.every(x=>dimIds.has(x))), `${D.brechas.length} brechas`],
    ["Cada dimensión N/E tiene al menos una brecha que la bloquea", DIM.filter(d=>d.puntaje===null).every(d=>D.brechas.some(b=>b.bloquea.includes(d.id))), DIM.filter(d=>d.puntaje===null).map(d=>d.corto).join(", ")],
    ["Toda dimensión N/E justifica su ausencia de puntaje", DIM.filter(d=>d.puntaje===null).every(d=>d.por_que_null), "campo por_que_null presente"],
    ["El veredicto respeta las reglas (sin favorable con críticas abiertas ni con dimensión < 3)", rules[V.valor]===true, `${S.sev["Crítica"]} críticas · mínimo evaluado ${Math.min(...EVAL.map(d=>d.puntaje))}`],
    ["Veredicto dentro de los cuatro permitidos", Object.keys(SEMAFORO).includes(V.valor), V.valor]
  ];
}

function renderAuto(){
  const A=D.autoverificacion, chk=coherencia(), okAll=chk.every(c=>c[1]);
  $("#s-auto").innerHTML = `
  <h2>Registro de autoverificación</h2>
  <p class="lead">Qué revisé, qué corregí y qué queda como limitación. Los controles de coherencia se calculan en vivo sobre los mismos datos que alimentan todas las secciones.</p>
  <div class="card"><h3>Controles de coherencia de datos: <span class="${okAll?'ok':'bad'}">${okAll?"✔ todos correctos":"✖ hay fallos"}</span></h3>
    <table><thead><tr><th>Control</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody>
    ${chk.map(c=>`<tr><td>${esc(c[0])}</td><td class="${c[1]?'ok':'bad'}">${c[1]?"✔ OK":"✖ FALLA"}</td><td>${esc(c[2])}</td></tr>`).join("")}</tbody></table></div>
  <details open><summary>Qué revisé</summary><div class="body"><ul>${A.revisado.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  <details open><summary>Qué corregí durante el análisis</summary><div class="body"><ul>${A.corregido.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  <details open><summary>Cifras recalculadas</summary><div class="body"><div class="tbl-wrap"><table class="stack"><thead><tr><th>Cálculo</th><th>Resultado</th><th>Estado</th><th>Nota</th></tr></thead><tbody>
    ${A.cifras.map(c=>`<tr><td data-l="Cálculo">${esc(c.c)}</td><td data-l="Resultado">${esc(c.r)}</td><td data-l="Estado" class="${c.ok?'ok':'bad'}">${c.ok?"✔ Correcto":"✖ Discrepancia"}</td><td data-l="Nota">${esc(c.n)}</td></tr>`).join("")}</tbody></table></div></div></details>
  <details open><summary>Limitaciones del análisis</summary><div class="body"><ul>${A.limitaciones.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>`;
}

/* ---------- Navegación, tema, arranque ---------- */
const TABS=[
  ["resumen","Resumen ejecutivo",()=>""],
  ["matriz","Matriz de viabilidad",()=>`${S.eval}/${S.totdim}`],
  ["incong","Incongruencias",()=>S.total],
  ["premortem","Pre-mortem",()=>D.premortem.length],
  ["supuestos","Supuestos críticos",()=>D.supuestos.length],
  ["brechas","Brechas de información",()=>S.brechas],
  ["condiciones","Condiciones para aprobar",()=>D.condiciones.length],
  ["auto","Autoverificación",()=>""]
];
function show(id){
  TABS.forEach(t=>{$("#s-"+t[0]).hidden = t[0]!==id});
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===id?"page":"false"));
  $("#main").scrollIntoView({block:"start"});
  window.scrollTo({top:0});
}
function buildNav(){
  $("#nav").innerHTML=TABS.map(t=>`<button type="button" data-t="${t[0]}"><span>${t[1]}</span><span class="n">${t[2]()}</span></button>`).join("");
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)});
}
document.addEventListener("click",e=>{
  const c=e.target.closest("button[data-inc]");
  if(c){show("incong");$("#fSev").value="";$("#fTipo").value="";$("#fQ").value=c.dataset.inc;$("#fQ").dispatchEvent(new Event("input"))}
});
const themes=["auto","light","dark"], tname={auto:"automático",light:"claro",dark:"oscuro"};
let ti=0;
function applyTheme(){
  const t=themes[ti];
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  $("#themeBtn").textContent="Tema: "+tname[t];$("#themeBtn2").textContent="Tema: "+tname[t];
}
["themeBtn","themeBtn2"].forEach(id=>$("#"+id).addEventListener("click",()=>{ti=(ti+1)%3;applyTheme()}));
window.addEventListener("beforeprint",()=>$$("details").forEach(d=>d.open=true));

$("#brandSub").textContent = D.meta.proyecto+" · "+D.meta.fecha;
$("#foot").textContent = "Diagnóstico generado el "+D.meta.fecha+". Todos los datos provienen del objeto DIAGNOSTICO de este archivo; no usa almacenamiento local ni servicios externos.";
buildNav();
renderResumen();renderMatriz();renderIncong();renderPremortem();renderSupuestos();renderBrechas();renderCondiciones();renderAuto();
applyTheme();
show(TABS.some(t=>t[0]===location.hash.slice(1)) ? location.hash.slice(1) : "resumen");
</script>

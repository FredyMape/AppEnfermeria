<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de viabilidad · AppEnfermería</title>
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--surface2:#eeede9;--text:#1a1d21;--muted:#565f6b;--border:#d5d9de;--accent:#1f5fae;
  --red:#a8241c;--red-bg:#fdecea;--amber:#7a4b00;--amber-bg:#fff2d2;--green:#17603a;--green-bg:#e1f3e8;--gray:#4d5560;--gray-bg:#eceef1;
  --c-critica:#a8241c;--c-alta:#b23a08;--c-media:#7a5d00;--c-baja:#365a86;
  --heat0:#e6f2e9;--heat1:#fff2d2;--heat2:#ffdcb8;--heat3:#f9b8b0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217;--surface:#171b22;--surface2:#212733;--text:#e9ecf0;--muted:#a6afbb;--border:#303844;--accent:#7ab0ff;
    --red:#ff9a91;--red-bg:#3b1b19;--amber:#f3bf55;--amber-bg:#372b0d;--green:#75d8a0;--green-bg:#13321f;--gray:#b7bfca;--gray-bg:#272d36;
    --c-critica:#ff9a91;--c-alta:#ffab73;--c-media:#f2d160;--c-baja:#93b8ea;
    --heat0:#173225;--heat1:#3a3011;--heat2:#4a2f18;--heat3:#5a2622;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1217;--surface:#171b22;--surface2:#212733;--text:#e9ecf0;--muted:#a6afbb;--border:#303844;--accent:#7ab0ff;
  --red:#ff9a91;--red-bg:#3b1b19;--amber:#f3bf55;--amber-bg:#372b0d;--green:#75d8a0;--green-bg:#13321f;--gray:#b7bfca;--gray-bg:#272d36;
  --c-critica:#ff9a91;--c-alta:#ffab73;--c-media:#f2d160;--c-baja:#93b8ea;
  --heat0:#173225;--heat1:#3a3011;--heat2:#4a2f18;--heat3:#5a2622;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.35rem;margin-bottom:.25rem}
h3{font-size:1.02rem}
p{margin:.35rem 0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;align-self:start;height:100vh;padding:18px 12px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px;overflow:auto}
.brand{padding:4px 8px 12px}
.brand b{display:block;font-size:1rem}
.brand span{color:var(--muted);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.nav button:focus-visible,.btn:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.nav .n{opacity:.85;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:8px}
.btn{cursor:pointer;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 11px}
.btn:hover{background:var(--surface2)}
main{padding:24px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
section[hidden]{display:none}
.lead{color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.verdict{border:2px solid;border-radius:14px;padding:18px}
.verdict.rojo{border-color:var(--red);background:var(--red-bg)}
.verdict.amarillo{border-color:var(--amber);background:var(--amber-bg)}
.verdict.verde{border-color:var(--green);background:var(--green-bg)}
.verdict.gris{border-color:var(--gray);background:var(--gray-bg)}
.sem{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.rojo .dot{background:var(--red)}.amarillo .dot{background:var(--amber)}.verde .dot{background:var(--green)}.gris .dot{background:var(--gray)}
.rojo .sem{color:var(--red)}.amarillo .sem{color:var(--amber)}.verde .sem{color:var(--green)}.gris .sem{color:var(--gray)}
.verdict h1{font-size:clamp(1.35rem,3.2vw,1.95rem);margin:.35rem 0 .5rem}
.verdict ul{margin:.5rem 0 0;padding-left:1.15rem}
.verdict li{margin:.3rem 0}
.meta-line{font-size:.85rem;color:var(--muted);margin-top:.6rem}
.stat{padding:12px 14px}
.stat .v{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat.sev{border-left:6px solid}
.k-critica{border-color:var(--c-critica)}.k-alta{border-color:var(--c-alta)}.k-media{border-color:var(--c-media)}.k-baja{border-color:var(--c-baja)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.tag.critica{color:var(--c-critica)}.tag.alta{color:var(--c-alta)}.tag.media{color:var(--c-media)}.tag.baja{color:var(--c-baja)}
.tag.verificada{color:var(--green)}.tag.supuesto{color:var(--amber)}.tag.sinsustento{color:var(--red)}.tag.inferencia{color:var(--accent)}.tag.ne{color:var(--gray)}
.acts{counter-reset:a;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.acts li{counter-increment:a;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.acts li::before{content:counter(a);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:.75rem;cursor:pointer}
.chip.static{cursor:default}
details{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:10px 0}
details>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style-position:inside}
details>.body{padding:2px 16px 14px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--border)}
thead th{background:var(--surface2);position:sticky;top:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
th button{all:unset;cursor:pointer;font:inherit;text-transform:inherit}
th button:focus-visible{outline:3px solid var(--accent)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
tr.dim-row{cursor:pointer}
tr.dim-row:hover{background:var(--surface2)}
tr.detail td{background:var(--surface2)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}
.controls label{display:grid;gap:3px;font-size:.78rem;color:var(--muted)}
.controls select,.controls input{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:150px}
.viz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
svg text{fill:var(--text);font-family:inherit}
svg .muted{fill:var(--muted)}
.cite{font-style:italic;color:var(--muted);font-size:.83rem}
.pm-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pm-list li{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.pm-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.warn{border:1px dashed var(--amber);background:var(--amber-bg);color:var(--text);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.progress{height:14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.progress>div{height:100%;background:var(--green);transition:width .2s}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.chk input{width:20px;height:20px;margin-top:2px}
.chk.done .t{text-decoration:line-through;color:var(--muted)}
.card-sup{display:grid;gap:6px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;margin-top:6px}
.small{font-size:.83rem;color:var(--muted)}
footer{margin-top:30px;color:var(--muted);font-size:.8rem}
main,.sidebar{min-width:0}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  main{padding:16px}
  .sidebar{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap}
  .hero,.viz{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}
  .mtoggle{display:inline-flex!important}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:2px solid var(--border);padding:8px 0}
  table.stack td{border:0;padding:4px 10px}
  table.stack td::before{content:attr(data-l);display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.03em}
}
.mtoggle{display:none}
@media (max-width:520px){.g4,.g3{grid-template-columns:1fr 1fr}}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .sidebar,.controls,.mtoggle{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  section[hidden]{display:block!important;break-before:page}
  section#s-resumen{break-before:auto}
  .card,details,.verdict,.acts li,.pm-list li{break-inside:avoid}
  details>.body{display:block}
  tr.detail[hidden]{display:table-row!important}
  .tbl-wrap{overflow:visible;border:0}
  thead th{position:static}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegación">
    <div class="brand"><b>Diagnóstico de viabilidad</b><span id="brandSub"></span></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="side-foot"><button class="btn" id="themeBtn" type="button" aria-label="Cambiar tema claro u oscuro">Tema: automático</button></div>
    <button class="btn mtoggle" id="themeBtn2" type="button" aria-label="Cambiar tema">Tema</button>
  </aside>
  <main id="main" tabindex="-1">
    <section id="s-resumen"></section>
    <section id="s-matriz" hidden></section>
    <section id="s-incong" hidden></section>
    <section id="s-premortem" hidden></section>
    <section id="s-supuestos" hidden></section>
    <section id="s-brechas" hidden></section>
    <section id="s-condiciones" hidden></section>
    <section id="s-auto" hidden></section>
    <footer id="foot"></footer>
  </main>
</div>

<script>
/* ============================================================
   ÚNICA FUENTE DE DATOS. Toda cifra, tabla y gráfica se deriva de aquí.
   Convención de comillas dentro de textos: « » (cita textual del corpus).
   ============================================================ */
const DIAGNOSTICO = {
  "meta": {
    "proyecto": "Plataforma de Servicios de Enfermería (AppEnfermeria)",
    "fecha": "2026-09-30",
    "ronda": "Auditoría acotada a lo que existe: contexto (Requirements-Context, vision, modelo de dominio, reglas, glosario, personas), HU-01…HU-04 y coherencia de la definición del MVP. Las HU aún no escritas no se cuentan como incongruencias: figuran como brechas de información.",
    "corpus": [
      "Requirements-Context.md (normativo)",
      "HU-01, HU-02, HU-03, HU-04 (normativo, «Definida para MVP»)",
      "specs/context/vision.md (status: «aprobado»; define el alcance del MVP)",
      "specs/context/domain-model.md, business-rules-index.md, glossary.md, personas.md (contexto derivado)"
    ],
    "sin_codigo": "El repositorio contiene solo documentación y definiciones de agentes de proceso (0 archivos de código de producto). La evaluación es de la especificación, no de una implementación.",
    "decision": "Decisión de negocio (2026-09-30): la aplicación se realizará como intermediario tecnológico (marketplace) que conecta usuarios con enfermeros independientes; no como prestador de servicios de salud."
  },
  "dimensiones_def": [
    {
      "id": "tecnica",
      "nombre": "Técnica",
      "corto": "Técnica"
    },
    {
      "id": "financiera",
      "nombre": "Financiera",
      "corto": "Financiera"
    },
    {
      "id": "operativa",
      "nombre": "Operativa",
      "corto": "Operativa"
    },
    {
      "id": "mercado",
      "nombre": "Mercado / demanda",
      "corto": "Mercado"
    },
    {
      "id": "legal",
      "nombre": "Legal / regulatoria",
      "corto": "Legal"
    },
    {
      "id": "cronograma",
      "nombre": "Cronograma",
      "corto": "Cronograma"
    },
    {
      "id": "riesgos",
      "nombre": "Riesgos externos",
      "corto": "Riesgos ext."
    },
    {
      "id": "sostenibilidad",
      "nombre": "Sostenibilidad",
      "corto": "Sostenib."
    }
  ],
  "veredicto": {
    "valor": "NO VIABLE EN SU ESTADO ACTUAL",
    "confianza": "Media",
    "confianza_detalle": "Alta en las incongruencias (cada una tiene cita textual verificable en el corpus vigente). Baja en la viabilidad económica y de mercado: {ne} de {totdim} dimensiones no son evaluables por falta de datos.",
    "alcance_veredicto": "El veredicto califica el conjunto de especificaciones tal como está, no la idea de negocio. Con las {ne} dimensiones sin datos, el mejor resultado posible tras corregir la especificación sería «INSUFICIENTE INFORMACIÓN», no «VIABLE».",
    "razones": [
      "Hay {crit} incongruencia crítica abierta: el modelo de asignación que define el MVP (directorio, invitación dirigida y negociación en vision.md) contradice la asignación atómica por orden de llegada y la máquina de estados de Requirements-Context (INC-03). Hay además {alta} altas.",
      "Solo {eval} de {totdim} dimensiones son evaluables y {reprob} de esas {eval} quedan por debajo de 3: la regla exige que ninguna evaluada sea menor a 3 para poder ser «VIABLE».",
      "Las incongruencias se miden solo contra lo que existe; las HU pendientes no se cuentan como defecto. Aun así, no hay presupuesto, cronograma, equipo ni datos de mercado en ningún documento."
    ]
  },
  "reconstruccion": {
    "objetivo": "Marketplace que conecta a personas que necesitan enfermería (para sí o para un tercero) con enfermeros registrados y aprobados manualmente por un superadministrador. Cubre aceptación atómica de servicios, inicio por PIN, extensión, finalización y calificación obligatoria, con auditoría de operaciones y manejo de datos médicos sensibles.",
    "alcance": "Desde CN-10, vision.md (aprobado) es la fuente de verdad del alcance del MVP: además del flujo base de Requirements-Context y HU-01…04, incluye directorio con invitación directa, geolocalización real del enfermero, precio híbrido con negociación, pasarela de pagos, verificación facial del enfermero (registro e inicio de servicio) y ubicación en tiempo real con contacto de emergencia. Ninguno de esos cinco componentes tiene HU, modelo de datos ni proveedor.",
    "entregables": "Solo documentación: 4 HU definidas y 13 pendientes (HU-05…HU-17, planificadas en Req §29); el índice de reglas lista además 9 vacíos no planificados. Sin código de producto, sin diseños. Las HU pendientes se tratan como brechas, no como incongruencias.",
    "actores": "Usuario/Cliente, Enfermero, Superadministrador (roles fijos, uno por persona). «Soporte» se menciona pero no existe como rol.",
    "plazos": "No definidos en ningún documento.",
    "presupuesto": "No definido. Única mención: «No hay presupuesto asignado todavía» para verificación biométrica (vision §7).",
    "recursos": "No definidos (equipo de desarrollo, revisores de perfiles, soporte).",
    "supuestos_declarados": [
      "La plataforma es intermediario tecnológico y no prestador de salud (vision §5; declarado «por validar» y restricción activa sin resolver, §7).",

      "Modelo de precio híbrido: tarifa sugerida + oferta del usuario + contraoferta del enfermero (CN-06, decisión del developer).",

      "Internet obligatorio durante el servicio, sin modo offline (vision §7: «restricción de negocio aceptada»).",
      "El PIN no prueba presencia física del paciente en servicios para terceros: riesgo residual aceptado (CN-18, decisión del developer)."
    ],
    "ambiguedades": [
      "¿Cómo conviven la asignación atómica por orden de llegada, la negociación de precio y la invitación dirigida? No hay máquina de estados que las reconcilie (Req §10.2, nota INC-03).",
      "¿Quién cobra, cuánto y cuándo? No hay modelo de ingresos ni de liquidez, pero el MVP incluye pasarela.",
      "¿Cómo se muestra el PIN al usuario si solo se guarda su hash (Req §14.1 vs §14.2)?",
      "¿Qué significa «único por servicio» para el PIN: por servicio o entre todos los servicios?",
      "¿Qué puede hacer el superadministrador ante un perfil fraudulento si solo puede aprobar o pedir corrección (Req §6.1)?",
      "¿Cuántos revisores hay y qué más hace el superadministrador?",
      "¿Cuántas personas, con qué perfiles y en qué plazo construirán y operarán esto?"
    ]
  },
  "dimensiones": [
    {
      "id": "tecnica",
      "puntaje": 3,
      "confianza": "Media",
      "evidencia": [
        {
          "t": "VERIFICADA",
          "x": "Los principios declarados son correctos y varias decisiones ya se aplicaron: asignación única y atómica (Req §10.2), validación en backend (§21), contraseña de 12 a 64 caracteres (HU01-RN-06) y código de correo con TTL de 15 min, 5 intentos y 3 reenvíos por hora (HU01-RN-09)."
        },
        {
          "t": "VERIFICADA",
          "x": "Contradicción interna en el PIN: se exige guardarlo solo como hash y, a la vez, mostrárselo al usuario (Req §14.1 vs §14.2); «único por servicio» admite dos lecturas (INC-28, INC-31)."
        },
        {
          "t": "VERIFICADA",
          "x": "La máquina de estados del servicio tiene 5 estados (Req §8.1) y no soporta negociación, invitación dirigida, expiración ni cancelación con reglas (INC-03, INC-12). 0 coincidencias de MFA, zona horaria, latencia, RPO/RTO o volumetría en Requirements-Context, HU-01…04 y vision.md."
        },
        {
          "t": "SUPUESTO",
          "x": "Que el alcance aprobado en vision.md (pagos, biometría, geolocalización, tiempo real, negociación, directorio) sea construible: no hay arquitectura, proveedores ni requisitos no funcionales."
        },
        {
          "t": "VERIFICADA",
          "x": "No existe código de producto en el repositorio; no se evaluó implementación."
        }
      ],
      "riesgo": "Definición de MVP que la máquina de estados vigente no soporta, y una regla de seguridad (PIN) que no se puede cumplir tal como está escrita."
    },
    {
      "id": "financiera",
      "puntaje": null,
      "confianza": "—",
      "evidencia": [
        {
          "t": "VERIFICADA",
          "x": "0 menciones de presupuesto total, costos, precios reales o ingresos en Requirements-Context y HU. Única cifra económica: la ausencia de presupuesto para biometría (vision §7). La comisión figura como «A definir»."
        }
      ],
      "riesgo": "No evaluable: no se puede saber si el proyecto es financiable ni rentable.",
      "por_que_null": "Sin presupuesto, costos por transacción (biometría, pasarela, mensajería, nube) ni modelo de ingresos."
    },
    {
      "id": "operativa",
      "puntaje": 2,
      "confianza": "Baja",
      "evidencia": [
        {
          "t": "VERIFICADA",
          "x": "Toda aprobación de enfermeros es manual y la hace un único rol que además configura y audita (HU-03 RN-09; Req §22). Tras unificar los estados no existe acción terminal ni suspensión (INC-29)."
        },
        {
          "t": "VERIFICADA",
          "x": "El «soporte» que recibe el evento de bloqueo por PIN (Req §15) y al que se puede acudir con una calificación pendiente (§19.1) no existe como rol (Req §2 fija tres roles), proceso ni historia; el desbloqueo sigue «pendiente de definición»."
        },
        {
          "t": "SUPUESTO",
          "x": "Que 24–36 h sea alcanzable: vision §8 admite que el SLA «se degrada rápidamente» y no hay revisores, reloj ni métricas."
        },
        {
          "t": "VERIFICADA",
          "x": "0 menciones al tamaño del equipo: la confianza de esta calificación es baja."

/* ============================================================
   DERIVACIÓN: todo lo que se muestra se calcula desde DIAGNOSTICO
   ============================================================ */
const D = DIAGNOSTICO;
const SEV = ["Crítica","Alta","Media","Baja"];
const SEVKEY = {"Crítica":"critica","Alta":"alta","Media":"media","Baja":"baja"};
const SEVICON = {"Crítica":"✖","Alta":"▲","Media":"◆","Baja":"●"};
const SEVRANK = {"Crítica":0,"Alta":1,"Media":2,"Baja":3};
const ESTADOS = ["VERIFICADA","SUPUESTO","SIN SUSTENTO"];
const ESTKEY = {"VERIFICADA":"verificada","SUPUESTO":"supuesto","SIN SUSTENTO":"sinsustento","INFERENCIA":"inferencia"};
const ESTICON = {"VERIFICADA":"✔","SUPUESTO":"?","SIN SUSTENTO":"✖","INFERENCIA":"≈"};
const SEMAFORO = {
  "VIABLE":{cls:"verde",txt:"Verde"},
  "VIABLE CON CONDICIONES":{cls:"amarillo",txt:"Amarillo"},
  "NO VIABLE EN SU ESTADO ACTUAL":{cls:"rojo",txt:"Rojo"},
  "INSUFICIENTE INFORMACIÓN":{cls:"gris",txt:"Gris"}
};
const dimDef = Object.fromEntries(D.dimensiones_def.map(d=>[d.id,d]));
const DIM = D.dimensiones.map(d=>({...dimDef[d.id],...d}));
const EVAL = DIM.filter(d=>d.puntaje!==null);
const S = {
  sev: Object.fromEntries(SEV.map(s=>[s,D.incongruencias.filter(i=>i.sev===s).length])),
  total: D.incongruencias.length,
  totdim: DIM.length,
  eval: EVAL.length,
  ne: DIM.length-EVAL.length,
  aprob: EVAL.filter(d=>d.puntaje>=3).length,
  reprob: EVAL.filter(d=>d.puntaje<3).length,
  avg: EVAL.reduce((a,d)=>a+d.puntaje,0)/EVAL.length,
  brechas: D.brechas.length,
  brechasAltas: D.brechas.filter(b=>b.prioridad==="Alta").length,
  est: Object.fromEntries(ESTADOS.map(e=>[e,D.supuestos.filter(s=>s.estado===e).length]))
};
const fmt1 = n => n.toFixed(2).replace(".",",");
const sub = s => String(s)
  .replaceAll("{crit}",S.sev["Crítica"]).replaceAll("{alta}",S.sev["Alta"])
  .replaceAll("{eval}",S.eval).replaceAll("{totdim}",S.totdim)
  .replaceAll("{ne}",S.ne).replaceAll("{reprob}",S.reprob).replaceAll("{total}",S.total);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const sevTag = s => `<span class="tag ${SEVKEY[s]}"><span aria-hidden="true">${SEVICON[s]}</span>${esc(s)}</span>`;
const estTag = e => `<span class="tag ${ESTKEY[e]}"><span aria-hidden="true">${ESTICON[e]}</span>${esc(e)}</span>`;
const refChips = refs => `<div class="refs">${refs.map(r=>/^INC-/.test(r)?`<button class="chip" data-inc="${esc(r)}" type="button" title="Ver en Incongruencias">${esc(r)}</button>`:`<span class="chip static">${esc(r)}</span>`).join("")}</div>`;
const scoreColor = v => v<3 ? "var(--red)" : v<4 ? "var(--amber)" : "var(--green)";
const scoreWord = v => v===null ? "N/E" : v<3 ? "Reprobada" : "Aprobada";

/* ---------- Gráficas SVG propias ---------- */
function polar(cx,cy,r,deg){const a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arcPath(cx,cy,r,a0,a1){const [x0,y0]=polar(cx,cy,r,a0),[x1,y1]=polar(cx,cy,r,a1);const large=Math.abs(a1-a0)>180?1:0;return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`}

function gaugeSVG(score,max){
  const frac = Math.max(0,Math.min(1,score/max));
  const a1 = 180+180*frac;
  return `<svg viewBox="0 0 300 175" role="img" aria-label="Puntaje global ${fmt1(score)} de ${max}" style="width:100%;max-width:340px">
    <title>Puntaje global ${fmt1(score)} de ${max}</title>
    <path d="${arcPath(150,150,110,180,360)}" fill="none" stroke="var(--surface2)" stroke-width="24" stroke-linecap="round"/>
    <path d="${arcPath(150,150,110,180,a1)}" fill="none" stroke="${scoreColor(score)}" stroke-width="24" stroke-linecap="round"/>
    <text x="150" y="128" text-anchor="middle" font-size="40" font-weight="700">${fmt1(score)}</text>
    <text x="150" y="150" text-anchor="middle" font-size="13" class="muted">de ${max} · ${S.eval} de ${S.totdim} dimensiones evaluadas</text>
    <text x="30" y="172" text-anchor="middle" font-size="11" class="muted">1</text>
    <text x="270" y="172" text-anchor="middle" font-size="11" class="muted">${max}</text>
  </svg>`;
}

function radarSVG(){
  const cx=210,cy=205,R=140,n=DIM.length;
  const ang = i => -90 + i*360/n;
  let g="";
  for(let lv=1;lv<=5;lv++){
    const pts = DIM.map((_,i)=>polar(cx,cy,R*lv/5,ang(i)).map(v=>v.toFixed(1)).join(",")).join(" ");
    g += `<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
    const [lx,ly]=polar(cx,cy,R*lv/5,-90);
    g += `<text x="${(lx+4).toFixed(1)}" y="${(ly-2).toFixed(1)}" font-size="10" class="muted">${lv}</text>`;
  }
  DIM.forEach((d,i)=>{
    const [x,y]=polar(cx,cy,R,ang(i));
    const isNE = d.puntaje===null;
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" ${isNE?'stroke-dasharray="4 4"':''}/>`;
    const [tx,ty]=polar(cx,cy,R+26,ang(i));
    const anchor = Math.abs(tx-cx)<8?"middle":(tx>cx?"start":"end");
    g += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="12" font-weight="600">${esc(d.corto)}</text>`;
    g += `<text x="${tx.toFixed(1)}" y="${(ty+14).toFixed(1)}" text-anchor="${anchor}" font-size="12" class="muted">${isNE?"N/E":d.puntaje+" / 5"}</text>`;
  });
  const ev = DIM.map((d,i)=>({d,i})).filter(o=>o.d.puntaje!==null);
  const pts = ev.map(o=>polar(cx,cy,R*o.d.puntaje/5,ang(o.i)).map(v=>v.toFixed(1)).join(",")).join(" ");
  g += `<polygon points="${pts}" fill="var(--accent)" fill-opacity=".18" stroke="var(--accent)" stroke-width="2.5"/>`;
  ev.forEach(o=>{const [x,y]=polar(cx,cy,R*o.d.puntaje/5,ang(o.i));g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`});
  return `<svg viewBox="-50 0 520 420" role="img" aria-label="Radar de viabilidad por dimensión" style="width:100%;max-width:480px"><title>Radar de viabilidad; las dimensiones N/E no se dibujan como cero</title>${g}</svg>`;
}

function barsSVG(){
  const max = Math.max(...SEV.map(s=>S.sev[s]),1);
  const W=420,rowH=44,left=100;
  let g="";
  SEV.forEach((s,i)=>{
    const y=12+i*rowH, w=(W-left-50)*S.sev[s]/max;
    g += `<text x="0" y="${y+20}" font-size="13" font-weight="600">${SEVICON[s]} ${esc(s)}</text>`;
    g += `<rect x="${left}" y="${y}" width="${Math.max(w,2).toFixed(1)}" height="28" rx="5" fill="var(--c-${SEVKEY[s]})"/>`;
    g += `<text x="${(left+w+8).toFixed(1)}" y="${y+20}" font-size="14" font-weight="700">${S.sev[s]}</text>`;
  });

function donutSVG(){
  const cx=100,cy=100,r=70,sw=30, total=D.supuestos.length;
  const col = {"VERIFICADA":"var(--green)","SUPUESTO":"var(--amber)","SIN SUSTENTO":"var(--red)"};
  let a=-90,g="";
  ESTADOS.forEach(e=>{
    const n=S.est[e]; if(!n) return;
    const sweep=360*n/total;
    if(n===total){g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col[e]}" stroke-width="${sw}"/>`}
    else g+=`<path d="${arcPath(cx,cy,r,a,a+sweep)}" fill="none" stroke="${col[e]}" stroke-width="${sw}"/>`;
    const [tx,ty]=polar(cx,cy,r,a+sweep/2);
    g+=`<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width=".6" paint-order="stroke">${ESTICON[e]} ${n}</text>`;
    a+=sweep;
  });
  g+=`<text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="26" font-weight="700">${total}</text><text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="11" class="muted">supuestos</text>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Proporción de supuestos por estado" style="width:100%;max-width:260px"><title>Proporción de supuestos por estado</title>${g}</svg>`;
}

function heatSVG(){
  const cw=96,ch=74,ox=64,oy=8;
  let g="";
  for(let imp=5;imp>=1;imp--){
    for(let p=1;p<=5;p++){
      const s=p*imp, band = s>=15?3:s>=10?2:s>=5?1:0;
      const x=ox+(p-1)*cw, y=oy+(5-imp)*ch;
      g+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="var(--heat${band})" stroke="var(--surface)" stroke-width="2"/>`;
      g+=`<text x="${x+cw-6}" y="${y+13}" text-anchor="end" font-size="10" class="muted">${s}</text>`;
      const here = D.premortem.filter(m=>m.p===p&&m.i===imp);
      here.forEach((m,k)=>{
        const col=k%2,row=Math.floor(k/2);
        const bx=x+5+col*44, by=y+20+row*22;
        g+=`<rect x="${bx}" y="${by}" width="42" height="19" rx="4" fill="var(--surface)" stroke="var(--text)" stroke-width="1.2"/><text x="${bx+21}" y="${by+13}" text-anchor="middle" font-size="11" font-weight="700">${esc(m.id)}</text>`;
      });
    }
    g+=`<text x="${ox-8}" y="${oy+(5-imp)*ch+ch/2+4}" text-anchor="end" font-size="12" font-weight="600">${imp}</text>`;
  }
  for(let p=1;p<=5;p++) g+=`<text x="${ox+(p-1)*cw+cw/2}" y="${oy+5*ch+18}" text-anchor="middle" font-size="12" font-weight="600">${p}</text>`;
  g+=`<text x="${ox+2.5*cw}" y="${oy+5*ch+38}" text-anchor="middle" font-size="12" class="muted">Probabilidad (1 muy baja – 5 muy alta)</text>`;
  g+=`<text transform="translate(14 ${oy+2.5*ch}) rotate(-90)" text-anchor="middle" font-size="12" class="muted">Impacto (1 – 5)</text>`;
  return `<svg viewBox="0 0 ${ox+5*cw+8} ${oy+5*ch+48}" role="img" aria-label="Mapa de calor de probabilidad por impacto" style="width:100%;max-width:640px"><title>Mapa de calor probabilidad × impacto; el número pequeño de cada celda es probabilidad por impacto</title>${g}</svg>`;
}

    "INSUFICIENTE INFORMACIÓN": true
  };
  const uniq = arr => new Set(arr).size===arr.length;
  return [
    ["Suma por severidad = total de incongruencias", SEV.reduce((a,s)=>a+S.sev[s],0)===S.total, `${SEV.map(s=>S.sev[s]).join(" + ")} = ${S.total}`],
    ["Suma de estados de supuestos = total de supuestos", ESTADOS.reduce((a,e)=>a+S.est[e],0)===D.supuestos.length, `${ESTADOS.map(e=>S.est[e]).join(" + ")} = ${D.supuestos.length}`],
    ["Aprobadas + reprobadas + N/E = total de dimensiones", S.aprob+S.reprob+S.ne===S.totdim, `${S.aprob} + ${S.reprob} + ${S.ne} = ${S.totdim}`],
    ["Causas del mapa de calor = causas del pre-mortem", D.premortem.every(m=>m.p>=1&&m.p<=5&&m.i>=1&&m.i<=5), `${D.premortem.length} causas dentro de la cuadrícula 5×5`],
    ["Identificadores únicos en todas las listas", uniq(D.incongruencias.map(x=>x.id))&&uniq(D.brechas.map(x=>x.id))&&uniq(D.supuestos.map(x=>x.id))&&uniq(D.premortem.map(x=>x.id))&&uniq(D.condiciones.map(x=>x.id)), `${ids.size} identificadores distintos`],
    ["Toda referencia cruzada apunta a un elemento existente", allRefs.every(r=>ids.has(r)), `${allRefs.length} referencias comprobadas`],
    ["Toda brecha bloquea dimensiones válidas", D.brechas.every(b=>b.bloquea.every(x=>dimIds.has(x))), `${D.brechas.length} brechas`],
    ["Cada dimensión N/E tiene al menos una brecha que la bloquea", DIM.filter(d=>d.puntaje===null).every(d=>D.brechas.some(b=>b.bloquea.includes(d.id))), DIM.filter(d=>d.puntaje===null).map(d=>d.corto).join(", ")],
    ["Toda dimensión N/E justifica su ausencia de puntaje", DIM.filter(d=>d.puntaje===null).every(d=>d.por_que_null), "campo por_que_null presente"],
    ["El veredicto respeta las reglas (sin favorable con críticas abiertas ni con dimensión < 3)", rules[V.valor]===true, `${S.sev["Crítica"]} críticas · mínimo evaluado ${Math.min(...EVAL.map(d=>d.puntaje))}`],
    ["Veredicto dentro de los cuatro permitidos", Object.keys(SEMAFORO).includes(V.valor), V.valor]
  ];
}

function renderAuto(){
  const A=D.autoverificacion, chk=coherencia(), okAll=chk.every(c=>c[1]);
  $("#s-auto").innerHTML = `
  <h2>Registro de autoverificación</h2>
  <p class="lead">Qué revisé, qué corregí y qué queda como limitación. Los controles de coherencia se calculan en vivo sobre los mismos datos que alimentan todas las secciones.</p>
  <div class="card"><h3>Controles de coherencia de datos: <span class="${okAll?'ok':'bad'}">${okAll?"✔ todos correctos":"✖ hay fallos"}</span></h3>
    <table><thead><tr><th>Control</th><th>Resultado</th><th>Detalle</th></tr></thead><tbody>
    ${chk.map(c=>`<tr><td>${esc(c[0])}</td><td class="${c[1]?'ok':'bad'}">${c[1]?"✔ OK":"✖ FALLA"}</td><td>${esc(c[2])}</td></tr>`).join("")}</tbody></table></div>
  <details open><summary>Qué revisé</summary><div class="body"><ul>${A.revisado.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  <details open><summary>Qué corregí durante el análisis</summary><div class="body"><ul>${A.corregido.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>
  <details open><summary>Cifras recalculadas</summary><div class="body"><div class="tbl-wrap"><table class="stack"><thead><tr><th>Cálculo</th><th>Resultado</th><th>Estado</th><th>Nota</th></tr></thead><tbody>
    ${A.cifras.map(c=>`<tr><td data-l="Cálculo">${esc(c.c)}</td><td data-l="Resultado">${esc(c.r)}</td><td data-l="Estado" class="${c.ok?'ok':'bad'}">${c.ok?"✔ Correcto":"✖ Discrepancia"}</td><td data-l="Nota">${esc(c.n)}</td></tr>`).join("")}</tbody></table></div></div></details>
  <details open><summary>Limitaciones del análisis</summary><div class="body"><ul>${A.limitaciones.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details>`;
}

/* ---------- Navegación, tema, arranque ---------- */
const TABS=[
  ["resumen","Resumen ejecutivo",()=>""],
  ["matriz","Matriz de viabilidad",()=>`${S.eval}/${S.totdim}`],
  ["incong","Incongruencias",()=>S.total],
  ["premortem","Pre-mortem",()=>D.premortem.length],
  ["supuestos","Supuestos críticos",()=>D.supuestos.length],
  ["brechas","Brechas de información",()=>S.brechas],
  ["condiciones","Condiciones para aprobar",()=>D.condiciones.length],
  ["auto","Autoverificación",()=>""]
];
function show(id){
  TABS.forEach(t=>{$("#s-"+t[0]).hidden = t[0]!==id});
  $$("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===id?"page":"false"));
  $("#main").scrollIntoView({block:"start"});
  window.scrollTo({top:0});
}
function buildNav(){
  $("#nav").innerHTML=TABS.map(t=>`<button type="button" data-t="${t[0]}"><span>${t[1]}</span><span class="n">${t[2]()}</span></button>`).join("");
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.t)});
}
document.addEventListener("click",e=>{
  const c=e.target.closest("button[data-inc]");
  if(c){show("incong");$("#fSev").value="";$("#fTipo").value="";$("#fQ").value=c.dataset.inc;$("#fQ").dispatchEvent(new Event("input"))}
});
const themes=["auto","light","dark"], tname={auto:"automático",light:"claro",dark:"oscuro"};
let ti=0;
function applyTheme(){
  const t=themes[ti];
  if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
  $("#themeBtn").textContent="Tema: "+tname[t];$("#themeBtn2").textContent="Tema: "+tname[t];
}
["themeBtn","themeBtn2"].forEach(id=>$("#"+id).addEventListener("click",()=>{ti=(ti+1)%3;applyTheme()}));
window.addEventListener("beforeprint",()=>$$("details").forEach(d=>d.open=true));

$("#brandSub").textContent = D.meta.proyecto+" · "+D.meta.fecha;
$("#foot").textContent = "Diagnóstico generado el "+D.meta.fecha+". Todos los datos provienen del objeto DIAGNOSTICO de este archivo; no usa almacenamiento local ni servicios externos.";
buildNav();
renderResumen();renderMatriz();renderIncong();renderPremortem();renderSupuestos();renderBrechas();renderCondiciones();renderAuto();
applyTheme();
show(TABS.some(t=>t[0]===location.hash.slice(1)) ? location.hash.slice(1) : "resumen");
</script>
